on:
  schedule:
    # Dit zorgt ervoor dat het script elke nacht om 03:00 uur draait
    - cron: '0 3 * * *'
  workflow_dispatch: # Dit voegt een handmatige startknop toe op GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Code ophalen uit repository
      uses: actions/checkout@v4

    - name: Python installeren
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Benodigde bibliotheken installeren
      run: |
        pip install requests gspread oauth2client

    - name: Scraper script uitvoeren
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: python update_prices.py
