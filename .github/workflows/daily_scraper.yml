name: Dagelijkse Prijs Update

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: 

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Code ophalen uit repository
      uses: actions/checkout@v4

    - name: Python installeren
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Benodigde bibliotheken installeren
      run: |
        pip install gspread google-auth requests

    - name: Scraper script uitvoeren
      env:
        # HIER ZORGEN WE ERVOOR DAT BEIDE SLEUTELS WORDEN DOORGEGEVEN!
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
      run: python update_prices.py
