<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drogisterij Dupe Finder</title>
    <style>

        .btn { display: block; text-align: center; background: #3498db; color: white; padding: 10px; border-radius: 6px; text-decoration: none; margin-top: 10px; font-weight: bold; }

</head>

    <div class="header"> Drogisterij Deals & Dupes</div>
